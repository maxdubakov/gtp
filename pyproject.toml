[project]
name = "gtp"
version = "0.1.0"
description = "Guitar Tab Predictor — Audio → MIDI → Tablature"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade (modern Python 3.12 syntax)
    "B",      # bugbear (common bugs)
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length — handled by formatter
    "SIM118", # allow explicit dict.keys()
    "SIM108" # allow if-else as a larger block
]

[tool.ruff.format]
quote-style = "single"