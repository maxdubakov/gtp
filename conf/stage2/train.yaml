defaults:
  - evidence: none
  - _self_
  - experiment: null
  - override hydra/job_logging: none

name: adhoc
data_dir: data/stage2_p05
batch_size: 64
max_steps: 60000
# Eval and save are coupled: every checkpoint event runs val and writes a .pth.
checkpoint_steps: 1000
# More workers put IPC pressure on RunPod containers (ENOBUFS / SIGABRT after long runs).
num_workers: 2
seed: 42
device: null
resume: null
genre_conditioning: false
genre_dropout: 0.15
rebalance: false
notes: ''
wandb:
  project: gtp
  entity: null
  mode: online

hydra:
  run:
    dir: ${repo_root:}/runs/stage2/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/runs/stage2/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [experiment, name, wandb.mode, wandb.project, wandb.entity, num_workers, device]
