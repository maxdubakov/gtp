defaults:
  - _self_
  - override hydra/job_logging: none

name: fusion
checkpoint: runs/stage2_baseline/checkpoints/step_0060000_final.pth
strings_sweep: results/strings/sweeps/lopo
calibrated: true
splits: [val, test]
lambdas: [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
seeds: [0, 1, 2]
batch: 64
prob_floor: 1.0e-4
wandb:
  project: gtp
  entity: null
  mode: online

hydra:
  run:
    dir: ${repo_root:}/results/fusion/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/results/fusion/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [name, wandb.mode, wandb.project, wandb.entity]
