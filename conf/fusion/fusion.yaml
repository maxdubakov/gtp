defaults:
  - _self_
  - override hydra/job_logging: none

name: fusion_p05
data_dir: data/stage2_p05
splits: [val, test]
# GuitarSet audio exists only at the recorded capo; the other capo variants would reuse it.
capo0_only: true
models:
  baseline:
    checkpoint: runs/stage2/2026-11-08_11-58-31_p05_baseline/checkpoints/step_0060000_final.pth
    lambdas: [0.0, 0.5, 1.0, 1.5, 2.0]
  audio:
    checkpoint: runs/stage2/2026-11-08_11-58-31_p05_audio/checkpoints/step_0060000_final.pth
    lambdas: [0.0, 0.5, 1.0]
# Paired gains (method a - method b) with piece-bootstrap CIs; <model>_best is its val-selected lam.
comparisons:
  audio_vs_baseline: [audio_lam0, baseline_lam0]
  audio_vs_fusion: [audio_lam0, baseline_best]
  fusion_vs_baseline: [baseline_best, baseline_lam0]
evidence:
  test_player: 5
  heldin_sweep: results/strings/sweeps/nested05
  test_sweep: results/strings/sweeps/lopo
  calibrated: true
seeds: [0, 1, 2]
batch: 64
prob_floor: 1.0e-4
wandb:
  project: gtp
  entity: null
  mode: online

hydra:
  run:
    dir: ${repo_root:}/results/fusion/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/results/fusion/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [name, wandb.mode, wandb.project, wandb.entity]
