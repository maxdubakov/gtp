defaults:
  - _self_
  - override hydra/job_logging: none

name: select
run_dir: ???
every: 2000
data_dir: data/stage2_p05
# Selection uses val only; test stays untouched until the checkpoint is fixed.
splits: [val]
capo0_only: true
evidence:
  test_player: 5
  heldin_sweep: results/strings/sweeps/nested05
  test_sweep: results/strings/sweeps/lopo
  calibrated: true
seeds: [0, 1, 2]
batch: 64
prob_floor: 1.0e-4
wandb:
  project: gtp
  entity: null
  mode: online

hydra:
  run:
    dir: ${repo_root:}/results/select/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  job:
    config:
      override_dirname:
        exclude_keys: [name, wandb.mode, wandb.project, wandb.entity]
