defaults:
  - data: mic_logmel229
  - model: stringnet
  - optim: adamw_onecycle
  - wandb: default
  - _self_
  - experiment: null
  - override hydra/job_logging: none

name: index
index_dir: data/string_index
# Train on a random subset of this many training windows (0 = all); for smoke tests.
limit: 0
# Cached variants to train on (build_index_cache.py: 0 real, then augmented, then far-field renders); null = all.
variants: null
# Chains left out of training (their val and test recordings are still scored).
exclude_chains: []
# Datasets left out of training (e.g. guitarset, so the pipeline is zero-shot on it); still scored.
exclude_datasets: []
# Guitars (recordings.csv `guitar`) to hold out as the test set; every other recording trains. Empty = index splits.
holdout: []
# {guitar: string-set family} (physics_fusion.py's families.json); read when model.use_family is set.
families: null
# Family of a guitar the file doesn't list (one too small to hold out: the 88-note Ibanez RG, an electric).
family_default: plain_g
seed: 0

# Paper recipe (see model/stringnet.yaml): standard conv-BN-ReLU-pool order, 30 epochs.
model:
  pool_first: false
optim:
  epochs: 30

hydra:
  run:
    dir: ${repo_root:}/results/strings/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/results/strings/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [experiment, name, wandb, wandb.mode, wandb.project, wandb.entity]
