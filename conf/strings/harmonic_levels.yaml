defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

index_dir: data/string_index
sample_rate: 44100
# A note is read over one frame starting start_s after its onset. Of these lengths (samples, shortest first), those
# ending no more than tail_s after its offset are tried, and the one leaving the most usable harmonics is kept.
frames: [4096, 8192, 16384]
n_fft: 32768
start_s: 0.01
tail_s: 0.03
n_harmonics: 30
f_max: 9000
# The recording's tuning is the median offset of its notes' first harmonic above tuning_ref_hz, searched this far
# either side of concert pitch.
tuning_search_cents: 50
tuning_ref_hz: 400
# A harmonic is then read as the strongest bin within this range of n * f0, widened upwards for inharmonicity.
tuning_cents: 15
# A harmonic is present if it rises this far above the valleys towards its neighbours. Harmonics below a note's
# highest present one are all read, peaks or not (a comb's nulls are the evidence); those above it are not.
peak_db: 6
# Other sounding notes: assumed upper bound of their B, and how much overlap counts as sounding. A harmonic that
# falls where one of them has a partial is not used.
other_b_max: 3.0e-4
overlap_s: 0.01

# Envelope model (envelope.py): resolution of H and E, residual scale, and EM settings.
f_min: 70
bins_per_octave: 12
min_harmonics: 3
# Each note also keeps its own spectral tilt (pick, fingers, palm muting), not only its level.
tilt: true
iters: 15
sweeps: 3
shrink: 2
# Residual scale (dB): where EM starts, and the least it may fall to.
sigma_start_db: 6
sigma_min_db: 2

# Recordings per dataset, for a quick check; 0 = all.
limit: 0
workers: 9

hydra:
  output_subdir: null
  run:
    dir: .
