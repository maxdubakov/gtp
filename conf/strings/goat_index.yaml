defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

goat_dir: data/goat/GOAT
out_dir: data/string_index_goat
# Notes re-timed to each render's audio (scripts/stage1/retime_goat_test.py) to take the note times from; null keeps
# the fine-aligned MIDI's times.
retimed_notes: null
# Items of these splits: metadata.csv's, or with `manifest` the manifest's.
splits: [test]
# A Stage 1 notes manifest (build_notes_dataset.py, refine_labels.py): its GOAT entries choose the items and their
# train/val split, and their re-timed notes replace `retimed_notes`.
manifest: null
# Keep only items whose tab has this tuning (open pitches, string 1 first); the pipeline decodes in standard tuning.
# null = every item.
tuning: null
# Audio columns of metadata.csv that become recordings, with the chain each is calibrated as.
renders:
  di_audio_path: di
  amp_audio_path_1: amp1
  amp_audio_path_2: amp2
  amp_audio_path_3: amp3
  amp_audio_path_4: amp4
  amp_audio_path_5: amp5
# Renders kept per item, taken in turn from `renders`; null = all of them.
renders_per_item: null
# Onset clusters of the aligned MIDI (performance time) start this far apart; the tab's chords share one score time.
cluster_gap_s: 0.03
# DTW band, in chords, around the diagonal.
band: 400

hydra:
  output_subdir: null
  run:
    dir: .
