defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

# EGDB is left out on purpose: it is kept as a dataset no model here has trained on (the test TART reports).
datasets: [guitarset, guitar_techs, egset12, idmt, egfxset]
# Labels move when their lag differs from GuitarSet's (the detector's own bias) by more than one
# detector frame (128 / 22050 s); smaller differences are quantisation.
shift_threshold_ms: 6
# Place labels by <out_dir>/note_lags.csv (note_lags.py) where a recording has at least this many matched notes.
use_note_lags: true
min_note_pairs: 3
# A recording whose matched notes scatter further than this (median absolute deviation) around their lag is dropped.
max_note_mad_ms: 45
# Guitar-TECHS's camera microphones, added as chains of their own (real far-field recordings); [] = none.
room_mics: [ego, exo]
workers: 8
out_dir: data/string_index

hydra:
  output_subdir: null
  run:
    dir: .
