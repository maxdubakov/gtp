defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

datasets: [guitarset, guitar_techs, egset12, idmt, egfxset, egdb]
# Labels move when their lag differs from GuitarSet's (the detector's own bias) by more than one
# detector frame (128 / 22050 s); smaller differences are quantisation.
shift_threshold_ms: 6
workers: 8
out_dir: data/string_index

hydra:
  output_subdir: null
  run:
    dir: .
