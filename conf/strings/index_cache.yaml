defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

index_dir: data/string_index
feature: logmel229
# A cache with a window of its own, named after this; null = the string classifier's window, named after the feature.
cache: null
pre_frames: null
post_frames: null
# With feature cqt36 and a `cache`: cut each window around its note's pitch, `semitones` below and above it and
# above each of its first `harmonics` partials, e.g. {semitones: 5, harmonics: 4}; null = the whole spectrum.
pitch_relative: null
# Augmented renders per training recording, on top of the real one.
augment: 4
# And this many more through far-field chains (a distant microphone in a reverberant, noisy room).
augment_far: 4
# Recordings per dataset, for a quick check; 0 = all.
limit: 0
workers: 8

hydra:
  output_subdir: null
  run:
    dir: .
