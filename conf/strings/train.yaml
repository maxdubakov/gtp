defaults:
  - strings_schema
  - _self_
  - experiment: null
  - override hydra/job_logging: none

hydra:
  run:
    dir: ${repo_root:}/results/strings/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/results/strings/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [experiment, name, wandb.mode, wandb.project, wandb.entity]
