defaults:
  - _self_
  - override hydra/job_logging: none

name: physics_fusion
index_dir: data/string_index
# Run directories (relative to the repo) with index_probs.npz (predict_index.py); their probabilities are averaged.
runs: []
# Or held-out probabilities for every guitar (logo_probs.py): an .npz with `note` and `classifier`.
probs: null
# What the curves are multiplied into: the `classifier` probabilities, or only the pitch `prior` of prior_run's
# training notes (the curves on their own). The notes scored still come from `runs` or `probs`.
base: classifier
prior_run: results/strings/runs/2026-11-09_17-19-10_pool-flatten_w400_s0
# Notes calibrated together: the string constants are fitted over each group of these columns. A guitar's chains
# are kept apart, so a room recording does not borrow the constants its direct recording makes easy to find.
calibrate_by: [guitar, chain]
# Inharmonicity evidence: `point` (one B estimate per note, harmonic_features.py) or `profile` (a likelihood curve
# over B per note, b_profiles.py).
evidence: profile
features: harm.npz
profiles: bprof.npz
# Profile evidence: exponent on the raw likelihood curves, and the within-guitar scatter (decades) of a string's constant.
temper: 0.2
spread: 0.06
# The label-free calibration of the string constants uses the curves at this (sharper) exponent.
calibration_temper: 1.0
# Harmonic levels (harmonic_levels.py) and the exponent on the string-envelope likelihood fitted to them; 0 = off.
levels: levels.npz
envelope_temper: 0.3
# How far (decades) a guitar's string constants may sit from its string-set family's typical ones.
prior_sd: 0.12
# Point evidence: a note's inharmonicity is used only if its fit found B above the floor and left a small residual.
min_log_b: -6.9
max_resid_cents: 10
iters: 15
# Exponent on the inharmonicity likelihood when fused with the classifier.
weight: 1.0

hydra:
  run:
    dir: ${repo_root:}/results/strings/physics/${now:%Y-%m-%d_%H-%M-%S}_${name}
