defaults:
  - wandb: default
  - _self_
  - override hydra/job_logging: none

name: notes
data_dir: data/stage1_notes
# Note-model checkpoint to start from: Riley et al.'s guitar model (Kong's piano model fine-tuned on the Leduc jazz
# recordings; never saw GuitarSet or EGDB), from huggingface.co/xavriley/midi-transcription-models.
init: models/riley/fl.pth
seed: 0
# A checkpoint of a stopped run to continue from (model, optimizer, step); overrides init.
resume: null
# Riley et al.'s recipe: Adam at 1e-5, multiplied by lr_decay every lr_decay_steps.
lr: 1.0e-5
lr_decay: 0.9
lr_decay_steps: 10000
batch: 4
max_steps: 30000
log_steps: 50
eval_steps: 2500
save_steps: 2500
val_segments_per_group: 48
workers: 8
# Probability that a training segment is rendered through a random recording chain, by the recording's own chain:
# direct input gets the full pickup-amp-cabinet-room-microphone chain, microphone recordings a room and a microphone.
# Room recordings (ego, exo) are left as they are.
augment:
  di: 0.7
  amp-mic: 0.3
  amp-sim: 0.3
  acoustic-mic: 0.3
pitch_shift:
  prob: 0.5
  max_semitones: 2
# Share of training segments drawn from each dataset (relative; datasets left out get 1). null = in proportion to
# their hours.
dataset_weights:
  gaps: 1.0
  goat: 1.0
  guitar_techs: 1.0
  guitarset: 1.0
  egfxset: 0.4
  idmt: 0.4

hydra:
  run:
    dir: ${repo_root:}/runs/stage1/${now:%Y-%m-%d_%H-%M-%S}_${name}
  job:
    config:
      override_dirname:
        exclude_keys: [name, wandb.mode, wandb.project, wandb.entity]
