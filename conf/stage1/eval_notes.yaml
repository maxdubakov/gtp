defaults:
  - _self_
  - override hydra/job_logging: none

name: eval_notes
data_dir: data/stage1_notes
# Note-model checkpoints, relative to the repo.
checkpoints: []
splits: [val]
# At most this many recordings per (split, dataset, chain, content), to bound the time; 0 = all.
max_per_group: 0
onset_tolerance: 0.05
# Segments per forward pass. Stage 1 is several times slower on Apple's GPU than on the CPU, so set device there.
batch: 8
device: null

hydra:
  run:
    dir: ${repo_root:}/results/stage1/notes/${now:%Y-%m-%d_%H-%M-%S}_${name}
