defaults:
  - _self_
  - override hydra/job_logging: none

name: techniques
index_dir: data/technique_index2
feature: cqt36
# The window cache: 16 frames (0.19 s) before the onset, to hear the note before, and 68 (0.79 s) after, to hear
# the pitch move. This one follows each note's pitch: 5 semitones either side of it and of its next three partials,
# a third of a semitone per bin. `logmel229` with `logmel229_wide` is the whole spectrum instead.
cache: cqt36_pitch
# What the classifier says about a note. A head's class is the last of its classes one of whose marks the note
# carries, the first class for a note with none; a note with a mark in `unknown` has no label for the head.
heads:
  muting:
    classes: {plain: [], palm_mute: [palm_mute], dead: [dead]}
    unknown: [harmonic, pinch_harmonic, ghost, tie]
  start:
    classes: {picked: [], legato: [hammered], slide: [slid, slide_in]}
    unknown: [dead, tie, grace, tapping, harmonic, pinch_harmonic]
  pitch:
    # Vibrato notes count as steady: with vibrato as a third class nothing else got better or worse, and it was
    # found on 10% of a held-out player's notes.
    classes: {steady: [], bend: [bend]}
    unknown: [dead, tie, bend_take, slide_out, whammy, trill, tremolo_picking, harmonic, pinch_harmonic]
# Labels that are missing or not trusted, so the notes do not count for these heads in training or scoring:
# GOAT's dead marks are mostly not played dead (listening test, 20 Nov); an IDMT slide is one note whose pitch
# glides, not a note slid into.
unlabelled:
  - {dataset: goat, marks: [dead], heads: [muting]}
  - {dataset: idmt, marks: [slide], heads: [start, pitch]}
# Players whose recordings validate instead of train. All of GOAT's own validation and test pieces are played by
# player1, who also plays most of its training pieces; player2 (32 pieces on another guitar) is a new player.
validate_on:
  - {dataset: goat, player: player2}
# More views of each note, from other window caches of the same index, each through conv blocks of its own;
# `pool_bins` averages that many neighbouring frequency bins. E.g. the whole spectrum next to a pitch-following
# first view: [{feature: logmel229, cache: logmel229_wide, pool_bins: 4}].
more_views: []
# Tell the network about the note before on the same string: its fret and how long ago it started and ended.
context: false
# Partials of the note's pitch marked in a second input channel, so the network knows which of the sounding notes
# it is asked about (log-mel first view only); 0 = no such channel.
pitch_harmonics: 0
# Random changes to each training batch, against memorising the training notes. The window is moved by up to
# `shift_frames` in time and `shift_bins` in frequency; `time_masks` stretches of up to `time_mask` frames and
# `freq_masks` of up to `freq_mask` bins are blanked per note; `gain` is the spread of a level offset per note, in
# units of a bin's own spread. All off by default.
augment:
  shift_frames: 0
  shift_bins: 0
  time_masks: 0
  time_mask: 8
  freq_masks: 0
  freq_mask: 4
  gain: 0.0
# Cached variants to train on (0 real, then augmented, then far-field renders); null = all.
variants: null
# Datasets and chains left out of training (their validation recordings are still scored).
exclude_datasets: []
exclude_chains: []
# Train on a random subset of this many windows (0 = all); for smoke tests.
limit: 0
# The loss weighs a class by (its share of the training windows) ** -power, so rare classes are not drowned out.
class_weight_power: 0.5
# Score the test split too. Off while settings are still being chosen: test runs once, for the final configuration.
report_test: false
seed: 0

model:
  _target_: gtp.stage1.techniques.TechniqueNet
  width: 1.0
  pool: flatten
  dropout: 0.5
  conv_dropout: 0.1

optim:
  epochs: 30
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.0

wandb:
  project: gtp
  entity: null
  mode: disabled

hydra:
  run:
    dir: ${repo_root:}/results/techniques/runs/${now:%Y-%m-%d_%H-%M-%S}_${name}
  sweep:
    dir: ${repo_root:}/results/techniques/sweeps/${name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [name, wandb.mode]
