defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

out_dir: data/technique_index3
# The string index whose IDMT and Guitar-TECHS recordings (labels already aligned to the audio) are reused.
string_index: data/string_index
datasets: [idmt, guitar_techs]
# Indexes that already carry technique marks: GOAT's (scripts/stage1/strings/build_goat_index.py, the tab's marks)
# and the exercise recordings' (scripts/techniques/build_exercise_index.py). Their recordings of `chains` are added.
labelled_indexes:
  - data/technique_index3/goat_trainval
  - data/technique_index3/goat_test
  - data/technique_exercises
chains: [di]
# An IDMT annotation belongs to the index note of its pitch within this of it, once the recording's shift is removed.
match_s: 0.06
# In a Guitar-TECHS bend take, a note starting within this of the end of the last note on its string continues its bend.
bend_gap_s: 0.05

hydra:
  output_subdir: null
  run:
    dir: .
