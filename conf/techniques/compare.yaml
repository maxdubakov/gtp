defaults:
  - _self_
  - override hydra/job_logging: none

# Runs whose folder name (after the timestamp) matches one of these patterns; a trailing _s<seed> is dropped, so
# seeds of one setting are averaged.
runs_dir: results/techniques/runs
patterns: ['*']
# Columns: a validation group of the trainer's report, a head and one of its classes.
columns:
  - {name: p2 legato, group: goat/player2/di, head: start, class: legato}
  - {name: p2 slide, group: goat/player2/di, head: start, class: slide}
  - {name: p2 connected, group: goat/player2/di, head: attack, class: connected}
  - {name: p2 glide, group: goat/player2/di, head: glide, class: slide}
  - {name: p1 connected, group: goat/player1/di, head: attack, class: connected}
  - {name: p1 glide, group: goat/player1/di, head: glide, class: slide}
  - {name: p2 bend, group: goat/player2/di, head: pitch, class: bend}
  - {name: p2 palm, group: goat/player2/di, head: muting, class: palm_mute}
  - {name: p1 legato, group: goat/player1/di, head: start, class: legato}
  - {name: p1 slide, group: goat/player1/di, head: start, class: slide}
  - {name: evh palm, group: guitar_techs/P2/di, head: muting, class: palm_mute}
  - {name: evh palm room, group: guitar_techs/P2/ego, head: muting, class: palm_mute}
  - {name: evh bend, group: guitar_techs/P2/di, head: pitch, class: bend}
  - {name: idmt bend, group: idmt/christian-kehling/di, head: pitch, class: bend}
  - {name: idmt dead, group: idmt/christian-kehling/di, head: muting, class: dead}
  - {name: acoustic connected, group: ag_pt/lucfra/di, head: attack, class: connected}
  - {name: acoustic palm, group: ag_pt/lucfra/di, head: muting, class: palm_mute}
metric: F1

hydra:
  run:
    dir: .
  output_subdir: null
