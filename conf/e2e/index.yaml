defaults:
  - _self_
  - override hydra/job_logging: none

name: e2e_index
index_dir: data/string_index
splits: [val, test]
# Restrict to these guitars (recordings.csv `guitar`); empty = all of the splits.
guitars: []
inputs: [stage1, gt]
stage1_checkpoint: models/finetuned/step_0070000_final.pth
# Stage 1's recurrent layers run about six times faster on the CPU than on Apple's GPU.
stage1_device: cpu
stage2_checkpoint: runs/stage2/2026-11-08_11-58-31_p05_baseline/checkpoints/step_0060000_final.pth
# Recordings calibrated together: a guitar's string constants are fitted over each group of these columns.
calibrate_by: [guitar, chain]
# Glob patterns of train_index.py runs, relative to the repo; `{guitar}` selects each guitar's own held-out runs.
classifier_runs:
  - results/strings/runs/*pool-flatten_w400_s*
# Decode-time fusion weight and beam width, chosen on the val guitars (index_fusion.py).
lam: 1.3
beams: 8
# Overrides of conf/strings/b_profiles.yaml, physics_fusion.yaml and harmonic_levels.yaml, for trying settings
# without editing them.
profiles: {}
physics: {}
envelope: {}
# Chain the string evidence's audio is rendered through first (chains.py stages); null = the recording as is.
degrade: null
onset_tolerance: 0.05
prob_floor: 1.0e-4
# Recordings with fewer matched notes are left out of the equivalent accuracy.
min_notes_for_drift: 20
# A string sounds one note at a time: seconds of overlap tolerated before a string is closed to a new note; null = off.
exclusive_s: null
# Soft cost on fast position jumps and wide chords: nats per fret beyond `frets` between two fretted notes that
# start within window_s of each other; weight 0 = off.
jump:
  weight: 0.0
  frets: 4
  window_s: 0.25
batch: 64

hydra:
  run:
    dir: ${repo_root:}/results/e2e/index/${now:%Y-%m-%d_%H-%M-%S}_${name}
