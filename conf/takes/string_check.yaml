defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

takes_dir: data/takes
# Takes whose id contains one of these are left out, of the scores and of the fitting alike.
exclude: []
# Classifier run dirs whose calibrated distributions are averaged (e.g. the seeds of one sweep).
runs: []
# Where to write every note's truth, evidence and picks (relative to the repo); null = nowhere.
notes_out: null
stage2_checkpoint: runs/stage2/2026-11-08_11-58-31_p05_baseline/checkpoints/step_0060000_final.pth
# Decode-time fusion weight and beam width (the ones index_fusion.py picked on the val guitars).
lam: 1.3
beams: 8
prob_floor: 1.0e-4
# A string sounds one note at a time: seconds of overlap tolerated before a string is closed to a new note; null = off.
exclusive_s: null
# Soft cost on fast position jumps and wide chords: nats per fret beyond `frets` between two fretted notes that
# start within window_s of each other; weight 0 = off.
jump:
  weight: 0.0
  frets: 4
  window_s: 0.25

hydra:
  output_subdir: null
  run:
    dir: .
